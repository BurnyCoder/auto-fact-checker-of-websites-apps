<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* color-scheme: Chrome then draws the page, text and buttons dark when the browser/OS is in dark mode */
    :root { color-scheme: light dark; }
    body { font: 13px/1.5 system-ui, sans-serif; width: 260px; margin: 12px; }
    button { width: 100%; padding: 7px; margin-top: 8px; }
    .legend span { display: inline-block; margin-right: 8px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <b>Fact Check What You See</b>
  <div id="status">…</div>
  <button id="check">Check this page now</button>
  <button id="options">Options</button>
  <div class="legend" style="margin-top:10px">
    <span><i class="dot" style="background:#2e9d4f"></i>Supported</span>
    <span><i class="dot" style="background:#d93025"></i>Refuted</span>
    <span><i class="dot" style="background:#f0a400"></i>Cherry-picked</span>
    <span><i class="dot" style="background:#80868b"></i>Not enough evidence</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
